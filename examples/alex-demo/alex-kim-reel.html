<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>resumotion° player</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; color: #F2EDE6; overflow: hidden; }
  #wrap { position: relative; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
  #ui { position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
    padding: 14px 16px 18px; display: flex; align-items: center; gap: 10px;
    opacity: 0; transition: opacity .2s; }
  #wrap:hover #ui, #ui:focus-within { opacity: 1; }
  .btn { background: none; border: 1.5px solid rgba(255,255,255,.35); color: #fff;
    padding: 5px 13px; cursor: pointer; font-size: 12px; font-family: inherit;
    border-radius: 3px; white-space: nowrap; }
  .btn:hover { border-color: #fff; }
  #scrub { flex: 1; accent-color: #FF6B2B; cursor: pointer; }
  #time { font-size: 11px; opacity: .55; min-width: 80px; text-align: right; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; cursor: pointer; }
  #playBtn { width: 72px; height: 72px; border-radius: 50%;
    background: rgba(255,107,43,.9); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, opacity .15s; }
  #playBtn:hover { transform: scale(1.08); }
  #playBtn svg { margin-left: 5px; }
  #overlay.hidden { pointer-events: none; }
  #overlay.hidden #playBtn { opacity: 0; transform: scale(.8); }
  #soundOn { position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,.6); border: 1.5px solid rgba(255,255,255,.3);
    color: #fff; padding: 5px 12px; font-size: 11px; font-family: inherit;
    cursor: pointer; border-radius: 3px; }
  #recBtn { border-color: rgba(255,80,80,.6); }
  #recBtn.recording { border-color: #f55; color: #f55; animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: .4 } }
  #credit { position: absolute; bottom: 6px; right: 12px; font-size: 9px;
    opacity: .25; pointer-events: none; letter-spacing: .03em; }
</style>

<script>
// scenes.js — Alex Kim · Context Window theme
// BPM=100, DUR=TB(120)=72s

'use strict';
const W=1920,H=1080,FPS=30,BPM=100,B=60/BPM,TB=b=>b*B,DUR=TB(120);
const C={bg:'#0D1117',panel:'#161B22',code:'#21262D',border:'#30363D',
  user:'#D29922',assistant:'#3FB950',tool:'#58A6FF',think:'#BC8CFF',
  dim:'#8B949E',txt:'#E6EDF3',white:'#FFFFFF'};
const cl=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const P=(t,a,b)=>cl((t-a)/(b-a));
const L=(a,b,k)=>a+(b-a)*k;
const eo=x=>x>=1?1:1-Math.pow(2,-10*x);
const ei=x=>x<=0?0:Math.pow(2,10*x-10);
// seeded hash from "Alex Kim"
const SEED=('Alex Kim').split('').reduce((a,c,i)=>a+c.charCodeAt(0)*(i+1),0)%10000;
const hs=n=>{const x=Math.sin((SEED+n)*127.1+311.7)*43758.5453;return x-Math.floor(x)};

let FR=0;
const cv=document.getElementById('c');
const X=cv.getContext('2d');
cv.width=W;cv.height=H;

const JM=(sz,w=400)=>`${w} ${sz}px 'JetBrains Mono'`;
const SY=(sz,w=800)=>`${w} ${sz}px Syne`;

function T(c,s,x,y,{f,col=C.txt,al='left',a}={}){
  if(f)c.font=f;c.textAlign=al;c.textBaseline='middle';
  const pa=c.globalAlpha;if(a!=null)c.globalAlpha=pa*a;
  c.fillStyle=col;c.fillText(s,x,y);if(a!=null)c.globalAlpha=pa;
}
function TW(c,s,f){c.font=f;return c.measureText(s).width}
function RR(c,x,y,w,h,r,fill,stroke,sw=1){
  c.beginPath();c.roundRect(x,y,w,h,r);
  if(fill){c.fillStyle=fill;c.fill()}
  if(stroke){c.strokeStyle=stroke;c.lineWidth=sw;c.stroke()}
}
function STREAM(c,str,x,y,prog,{f=JM(22,400),col=C.txt,lh=40,maxW=0}={}){
  c.font=f;c.textAlign='left';c.textBaseline='middle';c.fillStyle=col;
  const vis=Math.min(str.length,Math.floor(prog*str.length+0.5));
  const shown=str.slice(0,vis);
  if(maxW>0){
    const words=shown.split(' ');let line='',ly=y,last='';
    for(const w of words){
      const test=line?line+' '+w:w;
      if(c.measureText(test).width>maxW&&line){c.fillText(line,x,ly);line=w;ly+=lh;}
      else line=test;
    }
    if(line){c.fillText(line,x,ly);last=line;}
    if(prog<1&&Math.floor(FR/8)%2===0){
      c.fillRect(x+c.measureText(last).width+2,ly-10,2,20);
    }
  } else {
    c.fillText(shown,x,y);
    if(prog<1&&Math.floor(FR/8)%2===0)
      c.fillRect(x+c.measureText(shown).width+2,y-10,2,20);
  }
}
function JBLOCK(c,lines,x,y,w,prog){
  const lh=30,pad=16,h=lines.length*lh+pad*2;
  RR(c,x,y,w,h,8,C.code,C.border,1);
  const vis=Math.floor(prog*lines.length);
  for(let i=0;i<vis;i++){
    const[k,v,vc=C.tool]=lines[i];
    const ly=y+pad+lh*i+lh/2;
    T(c,k,x+pad,ly,{f:JM(20,400),col:C.dim});
    T(c,v,x+pad+TW(c,k,JM(20,400)),ly,{f:JM(20,700),col:vc});
  }
  return h;
}
function METER(c,t,fill){
  const a=eo(P(t,TB(18),TB(21)));if(a<=0)return;
  const pa=c.globalAlpha;c.globalAlpha=pa*a;
  const x=1220,y=100,w=660,mh=28;
  T(c,'CONTEXT',x,y-20,{f:JM(16,700),col:C.dim});
  RR(c,x,y,w,mh,6,C.code,C.border,1);
  if(fill>0){
    const fw=(w-4)*fill;
    const grd=c.createLinearGradient(x+2,0,x+2+fw,0);
    grd.addColorStop(0,C.tool);
    grd.addColorStop(1,fill>=1?C.assistant:C.tool);
    RR(c,x+2,y+2,fw,mh-4,4,grd);
  }
  T(c,Math.round(fill*100)+'%',x+w/2,y+mh/2,{f:JM(16,700),col:C.txt,al:'center'});
  const info=[['model:   ','claude-opus-4-8'],['tokens:  ',Math.round(fill*8192)+' / 8192'],['chunks:  ',Math.round(fill*14)+' retrieved']];
  const iy=y+50;
  RR(c,x,iy,w,info.length*34+20,8,C.panel,C.border,1);
  info.forEach(([k,v],i)=>{
    T(c,k,x+16,iy+10+34*i+17,{f:JM(18,400),col:C.dim});
    T(c,v,x+16+TW(c,k,JM(18,400)),iy+10+34*i+17,{f:JM(18,700),col:C.tool});
  });
  c.globalAlpha=pa;
}
function HEADER(c,t){
  const a=eo(P(t,TB(8),TB(10)));if(a<=0)return;
  const pa=c.globalAlpha;c.globalAlpha=pa*a;
  RR(c,40,28,W-80,58,8,C.panel,C.border,1);
  T(c,'context_window',W/2,57,{f:SY(26,800),col:C.txt,al:'center'});
  if(Math.floor(FR/15)%2===0||t>TB(10)){
    c.fillStyle=C.assistant;c.beginPath();c.arc(W-120,57,5,0,7);c.fill();
  }
  T(c,'live session',W-108,57,{f:JM(18,700),col:C.assistant});
  c.globalAlpha=pa;
}

// ── scenes ──
function sceneBoot(c,t){
  if(t>=TB(10))return;
  const a=eo(P(t,0,TB(1)))*ei(1-P(t,TB(7.5),TB(9)));if(a<=0)return;
  const pa=c.globalAlpha;c.globalAlpha=pa*a;
  const pw=820,ph=240,px=W/2-pw/2,py=H/2-ph/2;
  RR(c,px,py,pw,ph,12,C.panel,C.border,1.5);
  const lines=[
    {s:'> context_window v2.4.1',col:C.assistant},
    {s:'> loading tools............. done',col:C.dim},
    {s:'> awaiting query',col:C.txt},
  ];
  const vis=Math.min(3,Math.floor(P(t,TB(1),TB(7))*4.5));
  lines.slice(0,vis).forEach(({s,col},i)=>{
    T(c,s,px+32,py+50+i*66,{f:JM(26,700),col:i===vis-1?col:C.dim});
  });
  if(vis>0&&Math.floor(FR/8)%2===0&&t<TB(6.5)){
    const lw=TW(c,lines[vis-1].s,JM(26,700));
    c.fillStyle=C.assistant;c.fillRect(px+32+lw+4,py+50+(vis-1)*66-12,3,24);
  }
  c.globalAlpha=pa;
}

function sceneQuery(c,t){
  if(t<TB(8)||t>TB(108))return;
  const dy=20*(1-eo(P(t,TB(8),TB(10))));
  const a=eo(P(t,TB(8),TB(10)))*ei(1-P(t,TB(104),TB(108)));if(a<=0)return;
  const pa=c.globalAlpha;c.globalAlpha=pa*a;
  RR(c,40,100+dy,1160,108,12,C.panel,C.user,1.5);
  T(c,'user',58,128+dy,{f:JM(18,700),col:C.user});
  STREAM(c,'who is this person? give me their story.',58,168+dy,eo(P(t,TB(9.5),TB(18))),{f:JM(24,400),col:C.txt,maxW:1100,lh:36});
  c.globalAlpha=pa;
}

function sceneTC1(c,t){
  if(t<TB(18)||t>TB(76))return;
  const dy=20*(1-eo(P(t,TB(18),TB(20))));
  const a=eo(P(t,TB(18),TB(20)))*ei(1-P(t,TB(72),TB(76)));if(a<=0)return;
  const pa=c.globalAlpha;c.globalAlpha=pa*a;
  RR(c,40,230+dy,1160,54,8,C.code,C.tool,1.5);
  T(c,'tool_call ',58,257+dy,{f:JM(20,700),col:C.tool});
  T(c,'retrieve_experience(  resume_id="alex_001"  )',58+TW(c,'tool_call ',JM(20,700)),257+dy,{f:JM(20,400),col:C.dim});
  JBLOCK(c,[
    ['role:       ','"Software Engineer"',C.user],

    ['stack:      ','"Python · LangGraph · Kubernetes"',C.tool],

  ],40,290+dy,1160,eo(P(t,TB(21),TB(37))));
  c.globalAlpha=pa;
}

function sceneTC2(c,t){
  if(t<TB(38)||t>TB(86))return;
  const dy=20*(1-eo(P(t,TB(38),TB(40))));
  const a=eo(P(t,TB(38),TB(40)))*ei(1-P(t,TB(82),TB(86)));if(a<=0)return;
  const pa=c.globalAlpha;c.globalAlpha=pa*a;
  RR(c,40,230+dy,1160,54,8,C.code,C.tool,1.5);
  T(c,'tool_call ',58,257+dy,{f:JM(20,700),col:C.tool});
  T(c,'analyze_projects(  resume_id="alex_001"  top_n=3  )',58+TW(c,'tool_call ',JM(20,700)),257+dy,{f:JM(20,400),col:C.dim});
  const projs=[
    {name:'CONTEXT COMPRESSION SDK',detail:'60% token reduction  ·  open source  ·  LLM infra',col:C.tool},
    {name:'AGENT MEMORY LAYER',detail:'persistent memory  ·  3 teams in production',col:C.assistant},
    {name:'EVAL HARNESS',detail:'40 model variants  ·  regression on prompt changes',col:C.think},
  ];
  projs.forEach(({name,detail,col},i)=>{
    const pp=eo(P(t,TB(40+i*5),TB(44+i*5)));if(pp<=0)return;
    const ppa=c.globalAlpha;c.globalAlpha=ppa*pp;
    const cy=290+i*132+dy;
    RR(c,40,cy,1160,118,10,C.panel,col,1.5);
    RR(c,40,cy,6,118,3,col);
    T(c,name,66,cy+42,{f:SY(30,800),col:C.txt});
    T(c,detail,66,cy+84,{f:JM(20,400),col:C.dim});
    c.globalAlpha=ppa;

}

function sceneThink(c,t){
  if(t<TB(58)||t>TB(96))return;

<!-- Injected by build.py: reel score (score.js) -->
<script>
// score.js — Alex Kim · Context Window theme
function score(ac, T0) {
  const t = b => T0 + b * (60/100);
  const mf = m => 440 * Math.pow(2, (m-69)/12);
  let sd = 42; const rnd = () => { sd=(sd*1664525+1013904223)>>>0; return sd/4294967296; };

  function tone(st, freq, dur, vol, type='triangle') {
    if(st<0||dur<=0||vol<=0) return;
    const g=ac.createGain(), o=ac.createOscillator();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,st);
    g.gain.linearRampToValueAtTime(vol,st+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,st+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(st); o.stop(st+dur+0.1);
  }

  function ping(st, f1, f2, vol=0.06) {
    tone(st, f1, 0.18, vol, 'sine');
    tone(st+0.04, f2, 0.10, vol*0.5, 'sine');
  }

  function tick(st, freq=1200, vol=0.022) { tone(st, freq, 0.04, vol, 'square'); }

  function pad(st, notes, dur, vol=0.02) {
    notes.forEach(m => tone(st, mf(m), dur, vol, 'triangle'));
  }

  // kick
  for(let b=0; b<120; b++) {
    const bt=t(b);
    const g=ac.createGain(), o=ac.createOscillator();
    o.type='sine'; o.frequency.setValueAtTime(80,bt);
    o.frequency.exponentialRampToValueAtTime(40,bt+0.08);
    g.gain.setValueAtTime(0.2,bt); g.gain.exponentialRampToValueAtTime(0.0001,bt+0.18);
    o.connect(g); g.connect(ac.destination); o.start(bt); o.stop(bt+0.3);
  }

  // hi-hats (quiet 16ths from beat 10)
  for(let b=10; b<120; b+=0.25) {
    const bt=t(b);
    const g=ac.createGain(), o=ac.createOscillator();
    o.type='square'; o.frequency.value=6000+rnd()*3000;
    g.gain.setValueAtTime(0.012,bt); g.gain.exponentialRampToValueAtTime(0.0001,bt+0.04);
    o.connect(g); g.connect(ac.destination); o.start(bt); o.stop(bt+0.06);
  }

  // pad chords — Am F C G
  const chords=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];
  for(let b=10; b<116; b+=4) pad(t(b), chords[Math.floor(b/4)%4], t(4)-t(0)*0.2);

  // boot ticks
  for(let b=1; b<7.5; b+=0.4) if(rnd()>0.4) tick(t(b), 900+rnd()*500, 0.04);

  // tool call pings
  ping(t(18), mf(64), mf(69), 0.08);
  ping(t(38), mf(65), mf(72), 0.08);
  ping(t(58), mf(67), mf(74), 0.07);
  ping(t(80), mf(60), mf(64), 0.09);

  // streaming ticks — query
  for(let b=9.5; b<18; b+=0.1) if(rnd()>0.55) tick(t(b), 1300+rnd()*200, 0.016);
  // thinking
  for(let b=60; b<78; b+=0.08) if(rnd()>0.65) tick(t(b), 1100+rnd()*200, 0.012);
  // final response
  for(let b=82; b<104; b+=0.1) if(rnd()>0.55) tick(t(b), 1000+rnd()*200, 0.016);

  // bespoke moment — meter hits 100% + response ends on same beat (104)
  [60,64,67,72].forEach((m,i) => tone(t(104)+i*0.055, mf(m), 0.5, 0.06, 'sine'));

  // outro chord
  [60,64,67,72].forEach(m => { tone(t(110), mf(m-12), t(4)-t(0), 0.035, 'triangle'); tone(t(110), mf(m), t(4)-t(0), 0.022, 'sine'); });
}

window.__audio = async function() {
  const sr=48000;
  const oc=new OfflineAudioContext(2, Math.ceil(sr*(72+0.5)), sr);
  score(oc, 0);
  const b=await oc.startRendering();
  const L=b.getChannelData(0), len=L.length;
  let peak=0; for(let i=0;i<len;i++) peak=Math.max(peak, Math.abs(L[i]));
  if(peak>0){const g=0.891/peak; for(let i=0;i<len;i++) L[i]*=g;}
  const buf=new ArrayBuffer(44+len*4), v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i))};
  ws(0,'RIFF'); v.setUint32(4,36+len*4,true); ws(8,'WAVEfmt ');
  v.setUint32(16,16,true); v.setUint16(20,3,true); v.setUint16(22,2,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*8,true);
  v.setUint16(32,8,true); v.setUint16(34,32,true); ws(36,'data');
  v.setUint32(40,len*4,true);
  for(let i=0;i<len;i++) v.setFloat32(44+i*4, L[i], true);
  const arr=new Uint8Array(buf);
  let s=''; for(let i=0;i<arr.length;i+=65536) s+=String.fromCharCode(...arr.subarray(i,i+65536));
  return 'data:audio/wav;base64,'+btoa(s);
};

</script>

<!-- Player runtime (do not modify) -->
<script>
(function () {
'use strict';

const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const playBtn = document.getElementById('play');
const bigBtn  = document.getElementById('playBtn');
const overlay = document.getElementById('overlay');
const scrub   = document.getElementById('scrub');
const timeEl  = document.getElementById('time');
const soundBtn = document.getElementById('soundOn');
const recBtn  = document.getElementById('recBtn');

let ac, audioBuf, audioSrc;
let playing = false, t = 0, startWall = 0, startT = 0, raf;
let DUR = 60, FPS = 30;

// ── Helpers ──
const fmt = s => { const m = Math.floor(s/60), sec = Math.floor(s%60); return `${m}:${String(sec).padStart(2,'0')}`; };

function resize() {
  const meta = window.__meta || {};
  const W = meta.W || 1920, H = meta.H || 1080;
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.width = W; canvas.height = H;
  canvas.style.width  = Math.round(W * scale) + 'px';
  canvas.style.height = Math.round(H * scale) + 'px';
}

function draw(time) { if (window.__render) window.__render(time); }

function tick() {
  if (!playing) return;
  t = Math.min(DUR, startT + (performance.now() / 1000 - startWall));
  draw(t);
  scrub.value = (t / DUR * 1000).toFixed(0);
  timeEl.textContent = `${fmt(t)} / ${fmt(DUR)}`;
  if (t >= DUR) { stop(); return; }
  raf = requestAnimationFrame(tick);
}

function play() {
  if (!ac) { soundBtn.style.display = 'flex'; return; }
  startWall = performance.now() / 1000;
  startT = t;
  playing = true;
  playBtn.textContent = '⏸ Pause';
  overlay.classList.add('hidden');
  if (audioSrc) { try { audioSrc.stop(); } catch {} }
  if (audioBuf) {
    audioSrc = ac.createBufferSource();
    audioSrc.buffer = audioBuf;
    audioSrc.connect(ac.destination);
    audioSrc.start(0, t);
  }
  raf = requestAnimationFrame(tick);
}

function stop() {
  playing = false;
  cancelAnimationFrame(raf);
  playBtn.textContent = '▶ Play';
  if (t >= DUR) { t = 0; overlay.classList.remove('hidden'); }
}

async function initAudio() {
  if (ac) return;
  ac = new AudioContext();
  soundBtn.style.display = 'none';
  if (window.__audio) {
    try {
      const b64 = await window.__audio();
      if (b64) {
        const str = atob(b64.replace(/^data:[^,]+,/, ''));
        const buf = new Uint8Array(str.length).map((_,i) => str.charCodeAt(i));
        audioBuf = await ac.decodeAudioData(buf.buffer);
      }
    } catch (e) { console.warn('[player] audio init failed:', e); }
  }
}

// ── Record video (canvas captureStream + MediaRecorder — no installs) ──
let _recorder, _chunks;
async function toggleRecord() {
  if (_recorder && _recorder.state === 'recording') {
    _recorder.stop();
    recBtn.classList.remove('recording');
    recBtn.textContent = '⏺ Record';
    return;
  }
  if (!ac) await initAudio();

  // Capture canvas at reel FPS
  const stream = canvas.captureStream(FPS);

  // Mix audio into the stream if available
  if (ac && audioBuf) {
    const dest = ac.createMediaStreamDestination();
    const src2 = ac.createBufferSource();
    src2.buffer = audioBuf;
    src2.connect(dest);
    src2.start(0, t);
    dest.stream.getAudioTracks().forEach(track => stream.addTrack(track));
  }

  _chunks = [];
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
    .find(m => MediaRecorder.isTypeSupported(m)) || '';
  _recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
  _recorder.ondataavailable = e => { if (e.data.size) _chunks.push(e.data); };
  _recorder.onstop = () => {
    const blob = new Blob(_chunks, { type: _recorder.mimeType });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'reel.webm'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  };
  _recorder.start(200);
  recBtn.classList.add('recording');
  recBtn.textContent = '⏹ Stop';
  // Start playback from beginning
  t = 0; play();
}

// ── Event listeners ──
playBtn.addEventListener('click', async () => {
  if (!ac) await initAudio();
  playing ? stop() : play();
});
bigBtn.addEventListener('click', async () => {
  if (!ac) await initAudio();
  play();
});
soundBtn.addEventListener('click', async () => { await initAudio(); play(); });
recBtn.addEventListener('click', toggleRecord);

scrub.addEventListener('input', () => {
  t = scrub.value / 1000 * DUR;
  startT = t; startWall = performance.now() / 1000;
  draw(t);
  timeEl.textContent = `${fmt(t)} / ${fmt(DUR)}`;
  if (audioSrc && playing) { try { audioSrc.stop(); } catch {} audioSrc = null; play(); }
});

window.addEventListener('resize', resize);
window.addEventListener('keydown', e => {
  if (e.code === 'Space')      { e.preventDefault(); playBtn.click(); }
  if (e.code === 'ArrowLeft')  { t = Math.max(0, t-2); draw(t); scrub.value = (t/DUR*1000).toFixed(0); }
  if (e.code === 'ArrowRight') { t = Math.min(DUR, t+2); draw(t); scrub.value = (t/DUR*1000).toFixed(0); }
});

// ?t= freeze mode (stills.js and debug)
const urlT = new URLSearchParams(location.search).get('t');
if (urlT !== null) {
  document.getElementById('ui').style.display = 'none';
  overlay.style.display = 'none';
  soundBtn.style.display = 'none';
  recBtn.style.display = 'none';
}

// ── Init ──
async function init() {
  await (window.__ready || Promise.resolve());
  const meta = window.__meta || {};
  DUR = meta.DUR || 60; FPS = meta.FPS || 30;
  resize();
  timeEl.textContent = `0:00 / ${fmt(DUR)}`;
  if (urlT !== null) draw(parseFloat(urlT));
  else draw(0);
}
init();

})();
</script>
