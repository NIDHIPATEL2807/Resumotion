<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>resumotion° player</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; color: #F2EDE6; overflow: hidden; }
  #wrap { position: relative; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
  #ui { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.8)); padding: 12px 16px 16px; display: flex; align-items: center; gap: 12px; opacity: 0; transition: opacity .2s; }
  #wrap:hover #ui, #ui:focus-within { opacity: 1; }
  #play { background: none; border: 1.5px solid rgba(255,255,255,.4); color: #fff; padding: 5px 14px; cursor: pointer; font-size: 13px; font-family: inherit; border-radius: 3px; }
  #play:hover { border-color: #fff; }
  #scrub { flex: 1; accent-color: #FF6B2B; cursor: pointer; }
  #time { font-size: 12px; opacity: .6; min-width: 80px; text-align: right; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #playBtn { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,107,43,.9); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .15s, opacity .15s; }
  #playBtn:hover { transform: scale(1.08); }
  #playBtn svg { margin-left: 5px; }
  #overlay.hidden { pointer-events: none; }
  #overlay.hidden #playBtn { opacity: 0; transform: scale(.8); }
  #soundOn { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.6); border: 1.5px solid rgba(255,255,255,.3); color: #fff; padding: 4px 10px; font-size: 11px; font-family: inherit; cursor: pointer; border-radius: 3px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay">
    <button id="playBtn" aria-label="Play">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="white"><polygon points="8,4 24,14 8,24"/></svg>
    </button>
  </div>
  <div id="ui">
    <button id="play">▶ Play</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" step="1">
    <span id="time">0:00 / 0:00</span>
  </div>
  <button id="soundOn">▶ sound on</button>
</div>

<script>
// ── reel contract expected on window ──
// window.__meta   = { DUR, FPS, BPM, scenes }
// window.__render = t => void
// window.__audio  = async () => base64 WAV
// window.__ready  = Promise

const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const playBtn = document.getElementById('play');
const bigBtn  = document.getElementById('playBtn');
const overlay = document.getElementById('overlay');
const scrub   = document.getElementById('scrub');
const timeEl  = document.getElementById('time');
const soundBtn = document.getElementById('soundOn');

let ac, audioBuf, audioSrc;
let playing = false, t = 0, startWall = 0, startT = 0, raf;
let DUR = 60, FPS = 30;

function fmt(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function resize() {
  const meta = window.__meta || {};
  const W = meta.W || 1920, H = meta.H || 1080;
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.width = W; canvas.height = H;
  canvas.style.width  = Math.round(W * scale) + 'px';
  canvas.style.height = Math.round(H * scale) + 'px';
}

function draw(time) {
  if (window.__render) window.__render(time);
}

function tick() {
  if (!playing) return;
  t = Math.min(DUR, startT + (performance.now() / 1000 - startWall));
  draw(t);
  scrub.value = (t / DUR * 1000).toFixed(0);
  timeEl.textContent = `${fmt(t)} / ${fmt(DUR)}`;
  if (t >= DUR) { stop(); return; }
  raf = requestAnimationFrame(tick);
}

function play() {
  if (!ac) { soundBtn.style.display = 'flex'; return; } // nudge to enable audio
  startWall = performance.now() / 1000;
  startT = t;
  playing = true;
  playBtn.textContent = '⏸ Pause';
  overlay.classList.add('hidden');
  if (audioSrc) { try { audioSrc.stop(); } catch {} }
  if (audioBuf) {
    audioSrc = ac.createBufferSource();
    audioSrc.buffer = audioBuf;
    audioSrc.connect(ac.destination);
    audioSrc.start(0, t);
  }
  raf = requestAnimationFrame(tick);
}

function stop() {
  playing = false;
  cancelAnimationFrame(raf);
  playBtn.textContent = '▶ Play';
  if (t >= DUR) { t = 0; overlay.classList.remove('hidden'); }
}

async function initAudio() {
  ac = new AudioContext();
  soundBtn.style.display = 'none';
  if (window.__audio) {
    const b64 = await window.__audio();
    if (b64) {
      const bin = atob(b64.split(',')[1]);
      const buf = new Uint8Array(bin.length).map((_,i)=>bin.charCodeAt(i));
      audioBuf = await ac.decodeAudioData(buf.buffer);
    }
  }
}

playBtn.addEventListener('click', async () => {
  if (!ac) await initAudio();
  playing ? stop() : play();
});
bigBtn.addEventListener('click', async () => {
  if (!ac) await initAudio();
  play();
});
soundBtn.addEventListener('click', async () => { await initAudio(); play(); });
scrub.addEventListener('input', () => {
  t = scrub.value / 1000 * DUR;
  startT = t; startWall = performance.now() / 1000;
  draw(t);
  timeEl.textContent = `${fmt(t)} / ${fmt(DUR)}`;
  if (audioSrc && playing) { try { audioSrc.stop(); } catch {} audioSrc = null; play(); }
});

window.addEventListener('resize', resize);
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  if (e.code === 'ArrowLeft')  { t = Math.max(0, t - 2); draw(t); scrub.value = (t/DUR*1000).toFixed(0); }
  if (e.code === 'ArrowRight') { t = Math.min(DUR, t + 2); draw(t); scrub.value = (t/DUR*1000).toFixed(0); }
});

// ?t= freeze mode (used by stills.js and debug)
const urlT = new URLSearchParams(location.search).get('t');
if (urlT !== null) {
  document.getElementById('ui').style.display = 'none';
  overlay.style.display = 'none';
  soundBtn.style.display = 'none';
}

async function init() {
  await (window.__ready || Promise.resolve());
  const meta = window.__meta || {};
  DUR = meta.DUR || 60; FPS = meta.FPS || 30;
  resize();
  timeEl.textContent = `0:00 / ${fmt(DUR)}`;
  if (urlT !== null) { draw(parseFloat(urlT)); }
  else draw(0);
}
init();
</script>
</body>
</html>
