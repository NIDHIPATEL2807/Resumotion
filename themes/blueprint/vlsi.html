 let z=1,zx=CX,zy=CY;if(b>=9.2&&b<10)z=L(1,2.8,ei(P(b,9.2,10)));if(b>=10&&b<10.6){z=L(1.5,1,eo(P(b,10,10.6)));zx=960;zy=540}
 X.save();X.translate(zx+(hs(FR*.71)-.5)*2*s,zy+(hs(FR*.37)-.5)*2*s);X.scale(z,z);X.translate(-zx,-zy);X.drawImage(buf,0,0);X.restore();X.globalAlpha=.035;X.drawImage(GR[FR%6],0,0,W,H);X.globalAlpha=1}
window.__render=render;

function score(ac,T0){let sd=8888;const rnd=()=>{sd=(sd*1664525+1013904223)>>>0;return sd/4294967296};
 const NB=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);{const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1}
 const IR=ac.createBuffer(2,ac.sampleRate*2.2,ac.sampleRate);for(let ch=0;ch<2;ch++){const d=IR.getChannelData(ch);for(let i=0;i<d.length;i++)d[i]=(rnd()*2-1)*Math.pow(1-i/d.length,3.2)}
 const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.15;const master=ac.createGain();master.gain.value=.85;master.connect(comp);comp.connect(ac.destination);
 const rev=ac.createConvolver();rev.buffer=IR;const rg=ac.createGain();rg.gain.value=.3;rev.connect(rg);rg.connect(master);
 const mus=ac.createGain();mus.connect(master);const duck=ac.createGain();duck.connect(mus);const sfx=ac.createGain();sfx.connect(master);
 // XY: pure, bypasses compressor and reverb so a real scope draws it cleanly
 const xyOut=ac.createGain();xyOut.gain.value=.42;xyOut.connect(ac.destination);
 genXY(ac.sampleRate).forEach(sg=>{const bf=ac.createBuffer(2,sg.L.length,ac.sampleRate);bf.copyToChannel(sg.L,0);bf.copyToChannel(sg.R,1);const s=ac.createBufferSource();s.buffer=bf;s.connect(xyOut);s.start(T0+TB(sg.b0))});
 const A=b=>T0+TB(b),mf=m=>440*Math.pow(2,(m-69)/12);
 function send(n,v){const g=ac.createGain();g.gain.value=v;n.connect(g);g.connect(rev)}
 function env(g,t,a,v,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
 function osc(t,f,d,ty,dest){const o=ac.createOscillator();o.type=ty;o.frequency.setValueAtTime(f,t);const g=ac.createGain();o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.1);return {o,g}}
 function nz(t,d,type,f,dest,q=1){const s=ac.createBufferSource();s.buffer=NB;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();s.connect(fl);fl.connect(g);g.connect(dest);s.start(t,rnd());s.stop(t+d+.05);return {g,fl}}
 const kick=(b,v=1,dest=mus)=>{const t=A(b);const {o,g}=osc(t,170,.4,'sine',dest);o.frequency.exponentialRampToValueAtTime(42,t+.1);env(g,t,.002,v,.34);const n=nz(t,.02,'highpass',3500,dest);env(n.g,t,.001,.2*v,.01)};
 const dk=b=>{const t=A(b);duck.gain.setValueAtTime(.35,t);duck.gain.linearRampToValueAtTime(1,t+TB(.45))};
 const hat=(b,v=1)=>{const n=nz(A(b),.05,'highpass',8500,duck);env(n.g,A(b),.001,.11*v,.04)};
 const clap=(b,v=1)=>{[0,.012,.024].forEach((d,i)=>{const n=nz(A(b)+d,i==2?.18:.02,'bandpass',1700,duck,.9);env(n.g,A(b)+d,.001,.28*v,i==2?.15:.012);if(i==2)send(n.g,.4)})};
 const bass=(b,m,v=.27)=>{const t=A(b);const lp=ac.createBiquadFilter();lp.type='lowpass';lp.Q.value=8;lp.frequency.setValueAtTime(1500,t);lp.frequency.exponentialRampToValueAtTime(170,t+.15);const g=ac.createGain();lp.connect(g);g.connect(duck);['sawtooth','square'].forEach((ty,i)=>{const o=ac.createOscillator();o.type=ty;o.frequency.value=mf(m)*(i?1.006:1);o.connect(lp);o.start(t);o.stop(t+.25)});env(g,t,.004,v,.18)};
 const pluck=(b,m,v=.045)=>{const t=A(b);const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(5000,t);lp.frequency.exponentialRampToValueAtTime(700,t+.14);const g=ac.createGain();lp.connect(g);g.connect(duck);send(g,.35);const o=ac.createOscillator();o.type='square';o.frequency.value=mf(m);o.connect(lp);o.start(t);o.stop(t+.22);env(g,t,.002,v,.16)};
 const pad=(b,ms,d,v=.03)=>{const t=A(b);const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(700,t);lp.frequency.linearRampToValueAtTime(2200,t+TB(d)*.7);const g=ac.createGain();lp.connect(g);g.connect(duck);send(g,.7);ms.forEach(m=>[-8,8].forEach(dt=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=mf(m);o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+TB(d)+.6)}));g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.25);g.gain.setValueAtTime(v,t+TB(d)-.2);g.gain.linearRampToValueAtTime(0,t+TB(d)+.4)};
 const impact=(b,v=1)=>{const t=A(b);kick(b,1.3*v,sfx);const {o,g}=osc(t,52,1.3,'sine',sfx);o.frequency.exponentialRampToValueAtTime(32,t+1.1);env(g,t,.004,.55*v,1.2);const n=nz(t,.6,'lowpass',1500,sfx);env(n.g,t,.002,.5*v,.45);send(n.g,.5)};
 const knob=b=>{for(let i=0;i<5;i++){const t=A(b)+i*.03;const n=nz(t,.012,'bandpass',3000,sfx,3);env(n.g,t,.001,.12,.01)}};
 const whoosh=b=>{const n=nz(A(b)-.25,.5,'bandpass',500,sfx,1.2);n.fl.frequency.setValueAtTime(500,A(b)-.25);n.fl.frequency.exponentialRampToValueAtTime(6000,A(b)+.2);n.g.gain.setValueAtTime(0,A(b)-.25);n.g.gain.linearRampToValueAtTime(.16,A(b));n.g.gain.exponentialRampToValueAtTime(.0001,A(b)+.25)};
 const blip=(b,m=88,v=.06)=>{const t=A(b);[0,.06].forEach((d,i)=>{const {g}=osc(t+d,mf(m+i*7),.08,'square',sfx);env(g,t+d,.002,v,.06)})};
 const ping=(b,v=.08)=>{const t=A(b);const {g}=osc(t,1320,.6,'sine',sfx);env(g,t,.002,v,.55);send(g,.6)};
 const zap=b=>{const t=A(b);const {o,g}=osc(t,1800,.12,'sawtooth',sfx);o.frequency.exponentialRampToValueAtTime(120,t+.1);env(g,t,.002,.07,.1)};
 const riser=(b0,b1,v=.2)=>{const a=A(b0),z=A(b1);const n=nz(a,z-a,'bandpass',400,sfx,2);n.fl.frequency.setValueAtTime(400,a);n.fl.frequency.exponentialRampToValueAtTime(9000,z);n.g.gain.setValueAtTime(.0001,a);n.g.gain.exponentialRampToValueAtTime(v,z-.02);n.g.gain.linearRampToValueAtTime(0,z)};

 const stab=(b,ms,v=.08)=>{const t=A(b);ms.forEach(m=>{const {g}=osc(t,mf(m),.3,'sawtooth',sfx);const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(5000,t);lp.frequency.exponentialRampToValueAtTime(500,t+.25);g.disconnect();g.connect(lp);lp.connect(sfx);env(g,t,.003,v,.28);send(g,.3)})};
 const tk=(b,f=2600,v=.04)=>{const t=A(b);const n=nz(t,.015,'bandpass',f,sfx,3);env(n.g,t,.001,v*2,.012)};
 riser(7,10,.18);
 const CH=[[45,[69,72,76]],[41,[69,72,77]],[48,[67,72,76]],[43,[67,71,74]]];const chAt=b=>CH[Math.floor((b-10)/4+400)%4];
 const IMPS=[[10,1],[24,.6],[46.8,1.1],[64,.5]];IMPS.forEach(([b,v])=>impact(b,v));
 for(let b=10;b<66;b+=1){if(!IMPS.some(x=>x[0]===b))kick(b,.95);dk(b);hat(b+.5,.9);if(b>=12&&b%2===1)clap(b,.9)}
 for(let b=12;b<66;b+=.25)hat(b,(b*4)%2?.35:.6);
 for(let b=10;b<66;b+=.5){const [r]=chAt(b);bass(b,r-12+((Math.round(b*2)%4===3)?12:0))}
 for(let b=10;b<66;b+=4)pad(b,chAt(b)[1].map(m=>m-12),4,.03);
 for(let b=19;b<65.5;b+=.25){const ns=chAt(b)[1];const k=Math.round(b*4)%8;pluck(b,ns[[0,1,2,1,0,2,1,2][k]]+12+(k==4?12:0),b>=37?.05:.04)}
 riser(43,46.8,.22);riser(62,64,.14);riser(64.6,66,.1);
 mus.gain.setValueAtTime(1,A(65.92));mus.gain.linearRampToValueAtTime(0,A(65.97));
 [10,16.4,19,29,37,43,49,55,62,65].forEach(b=>{knob(b);whoosh(b)});
 for(let i=0;i<22;i++)tk(10+i*.12,2000+i*60);
 for(let b=20.5;b<23.6;b+=.125)tk(b,3200,.03);stab(24,[57,64,69,76],.1);
 [20,21.1,22.2,23.3,24.4].forEach(b=>blip(b,84,.05));[20.5,21.6,22.7,23.8].forEach((b,i)=>blip(b,88+i*2,.06));blip(25.2,96,.08);
 [34,34.5,35,35.5,36].forEach(b=>blip(b,96,.06));whoosh(40.5);blip(40.5,91,.07);
 ping(44.6,.08);ping(46.6,.09);
 [50.4,50.7,51].forEach(zap);[51.4,52.4,53.4].forEach((b,i)=>blip(b,84+i*3,.08));
 for(let s2=0;s2<4;s2++)for(let i=0;i<5;i++)tk(56.2+s2*.9+i*.08,1800+i*200,.05);
 [62.5,63,63.5].forEach((b,i)=>blip(b,88+i*3,.08));stab(64,[60,64,67,72],.09);
 {const t=A(65.75);const n=nz(t,.02,'highpass',2000,sfx);env(n.g,t,.001,.3,.015);const {g}=osc(t,1000,.05,'sine',sfx);env(g,t,.001,.06,.04)}
 {const t=A(81.2);const n=nz(t,.02,'highpass',2000,sfx);env(n.g,t,.001,.2,.015)}
 return master}

window.__audio=async function(){const sr=SR;const oc=new OfflineAudioContext(2,Math.ceil(sr*(DUR+.4)),sr);score(oc,0);const b=await oc.startRendering();
 const L0=b.getChannelData(0),R0=b.getChannelData(1);let pk=0;for(let i=0;i<L0.length;i++)pk=Math.max(pk,Math.abs(L0[i]),Math.abs(R0[i]));const gn=.95/pk;
 const n=L0.length,ab=new ArrayBuffer(44+n*4),v=new DataView(ab);const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 ws(0,'RIFF');v.setUint32(4,36+n*4,true);ws(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,sr,true);v.setUint32(28,sr*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*4,true);
 for(let i=0;i<n;i++){v.setInt16(44+i*4,cl(L0[i]*gn,-1,1)*32767,true);v.setInt16(46+i*4,cl(R0[i]*gn,-1,1)*32767,true)}
 let s='';const u=new Uint8Array(ab);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};

let ac=null,t0=0,raf=0;
function loop(){const t=ac.currentTime-t0;render(cl(t,0,DUR));if(t<DUR)raf=requestAnimationFrame(loop);else document.getElementById('again').style.display='block'}
async function start(){cancelAnimationFrame(raf);if(ac)try{await ac.close()}catch(e){}ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();t0=ac.currentTime+.3;score(ac,t0);document.getElementById('ui').style.display='none';document.getElementById('again').style.display='none';loop()}
document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;
